apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleetman-apps
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/som-esh/fleetman-argo
    targetRevision: main
    path: manifests
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
    labels:
      istio.io/dataplane-mode: ambient
