apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fleetman-webapp
  namespace: default
spec:
  parentRefs:
    - name: public-gateway
      namespace: argocd
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /fleetman
      backendRefs:
        - name: fleetman-webapp
          port: 80